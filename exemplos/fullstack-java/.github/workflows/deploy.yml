name: Deploy Fullstack

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NOMAD_ADDR:        ${{ secrets.NOMAD_ADDR }}
  NOMAD_TOKEN:       ${{ secrets.NOMAD_TOKEN }}
  STUDENT_NAMESPACE: ${{ secrets.STUDENT_NAMESPACE }}

jobs:
  # ──────────────────────────────────────────────────────────
  # Opcional: escrever segredos no Vault antes do deploy
  # Ative definindo a Variable SYNC_VAULT_SECRETS=true
  # ──────────────────────────────────────────────────────────
  vault-secrets:
    name: Sync Vault Secrets
    runs-on: ubuntu-latest
    if: vars.SYNC_VAULT_SECRETS == 'true'
    steps:
      - name: Instalar Vault CLI
        run: |
          curl -fsSL "https://releases.hashicorp.com/vault/2.1.1/vault_2.1.1_linux_amd64.zip" -o vault.zip
          unzip -o vault.zip && sudo mv vault /usr/local/bin/

      - name: Escrever segredos no Vault
        env:
          VAULT_ADDR:        ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN:       ${{ secrets.VAULT_TOKEN }}
        run: |
          vault kv put "secret/students/${{ secrets.STUDENT_NAMESPACE }}/app" \
            db_password="${{ secrets.APP_DB_PASSWORD }}"           \
            db_root_password="${{ secrets.APP_DB_ROOT_PASSWORD }}" \
            jwt_secret="${{ secrets.APP_JWT_SECRET }}"

  # ──────────────────────────────────────────────────────────
  # Build: imagem do Backend
  # ──────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest

  # ──────────────────────────────────────────────────────────
  # Build: imagem do Frontend
  # ──────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest

  # ──────────────────────────────────────────────────────────
  # Deploy: MySQL → Backend → Frontend
  # vault-secrets é pré-requisito opcional:
  #   se SYNC_VAULT_SECRETS != true, é skipped e o deploy continua
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Nomad
    runs-on: ubuntu-latest
    needs: [vault-secrets, build-backend, build-frontend]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    env:
      PACKS_REGISTRY: github.com/ss-cstads/nomad-packs
      PACKS_REF: v1.0.0
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Nomad CLI e Nomad Pack
        run: |
          NOMAD_VERSION="2.0.7"
          NOMAD_PACK_VERSION="0.4.2"
          curl -fsSL "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip" -o nomad.zip
          curl -fsSL "https://releases.hashicorp.com/nomad-pack/${NOMAD_PACK_VERSION}/nomad-pack_${NOMAD_PACK_VERSION}_linux_amd64.zip" -o nomad-pack.zip
          unzip -o nomad.zip && unzip -o nomad-pack.zip && sudo mv nomad nomad-pack /usr/local/bin/

      - name: Registry de packs do cluster
        run: nomad-pack registry add ifsul "${PACKS_REGISTRY}" --ref="${PACKS_REF}"

      # Configuracao de cada parte em deploy/*.hcl
      - name: Deploy MySQL
        run: |
          nomad-pack run mysql --registry=ifsul --ref="${PACKS_REF}" \
            -f deploy/mysql.hcl \
            --var namespace="${STUDENT_NAMESPACE}"

      - name: Deploy Backend
        run: |
          nomad-pack run api --registry=ifsul --ref="${PACKS_REF}" \
            -f deploy/api.hcl \
            --var namespace="${STUDENT_NAMESPACE}" \
            --var image="${IMAGE}/backend:${{ github.sha }}"

      - name: Deploy Frontend
        run: |
          nomad-pack run web_app --registry=ifsul --ref="${PACKS_REF}" \
            -f deploy/web.hcl \
            --var namespace="${STUDENT_NAMESPACE}" \
            --var image="${IMAGE}/frontend:${{ github.sha }}"

      - name: Status final
        run: |
          for job in mysql api web; do
            echo "── $job ──"
            nomad job status -namespace="${STUDENT_NAMESPACE}" "$job" || true
          done
          echo ""
          echo "Acesse: https://${STUDENT_NAMESPACE}.projetos.sapucaia.ifsul.edu.br"
