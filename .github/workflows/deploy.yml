name: Deploy to HashiCorp Cluster

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NOMAD_ADDR:        ${{ secrets.NOMAD_ADDR }}
  NOMAD_TOKEN:       ${{ secrets.NOMAD_TOKEN }}
  STUDENT_NAMESPACE: ${{ secrets.STUDENT_NAMESPACE }}

jobs:
  # ============================================================
  # SECRETS (opcional): escrever segredos no Vault antes do deploy
  # Ative definindo a Variable SYNC_VAULT_SECRETS=true
  # ============================================================
  vault-secrets:
    name: Sync Vault Secrets
    runs-on: ubuntu-latest
    if: vars.SYNC_VAULT_SECRETS == 'true'
    steps:
      - name: Instalar Vault CLI
        run: |
          VAULT_VERSION="2.1.1"
          curl -fsSL "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip" -o vault.zip
          unzip -o vault.zip && sudo mv vault /usr/local/bin/

      - name: Escrever segredos no Vault
        env:
          VAULT_ADDR:        ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN:       ${{ secrets.VAULT_TOKEN }}
        run: |
          # PERSONALIZE: ajuste os segredos conforme sua aplicacao.
          # Cada segredo aqui deve ter um GitHub Secret correspondente.
          # Os nomes apos o "=" devem bater com o template no job.nomad.hcl.
          vault kv put "secret/students/${STUDENT_NAMESPACE}/app" \
            db_password="${{ secrets.APP_DB_PASSWORD }}" \
            api_key="${{ secrets.APP_API_KEY }}"

  # ============================================================
  # BUILD: construir e publicar imagem Docker no ghcr.io
  # ============================================================
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  # ============================================================
  # DEPLOY: submeter job ao Nomad
  # vault-secrets e pre-requisito opcional:
  #   se SYNC_VAULT_SECRETS != true, e skipped e o deploy continua
  # ============================================================
  deploy:
    name: Deploy to Nomad
    runs-on: ubuntu-latest
    needs: [vault-secrets, build]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Nomad CLI e Nomad Pack
        run: |
          NOMAD_VERSION="2.0.7"
          NOMAD_PACK_VERSION="0.4.2"
          curl -fsSL "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip" -o nomad.zip
          curl -fsSL "https://releases.hashicorp.com/nomad-pack/${NOMAD_PACK_VERSION}/nomad-pack_${NOMAD_PACK_VERSION}_linux_amd64.zip" -o nomad-pack.zip
          unzip -o nomad.zip && unzip -o nomad-pack.zip && sudo mv nomad nomad-pack /usr/local/bin/

      # ----------------------------------------------------------------
      # Com nomad-pack.hcl na raiz: deploy pelo pack (recomendado).
      # Sem ele: job.nomad.hcl escrito a mao (avancado).
      # ----------------------------------------------------------------
      - name: Deploy pelo Nomad Pack
        if: hashFiles('nomad-pack.hcl') != ''
        env:
          PACKS_REGISTRY: github.com/ss-cstads/nomad-packs
          PACKS_REF: v1.0.1
          PACK: ${{ vars.NOMAD_PACK || 'web_app' }}
        run: |
          nomad-pack registry add ifsul "${PACKS_REGISTRY}" --ref="${PACKS_REF}"
          nomad-pack run "${PACK}" --registry=ifsul --ref="${PACKS_REF}" \
            -f nomad-pack.hcl \
            --var namespace="${STUDENT_NAMESPACE}" \
            --var image="ghcr.io/${{ github.repository }}:${{ github.sha }}"

      - name: Deploy pelo job.nomad.hcl
        if: hashFiles('nomad-pack.hcl') == ''
        run: |
          nomad job validate \
            -var="namespace=${STUDENT_NAMESPACE}" \
            -var="image=ghcr.io/${{ github.repository }}:${{ github.sha }}" \
            job.nomad.hcl
          nomad job run -detach \
            -var="namespace=${STUDENT_NAMESPACE}" \
            -var="image=ghcr.io/${{ github.repository }}:${{ github.sha }}" \
            job.nomad.hcl
          sleep 15
          JOB=$(grep '^job "' job.nomad.hcl | head -1 | awk -F'"' '{print $2}')
          nomad job status -namespace="${STUDENT_NAMESPACE}" "${JOB}" || true

      - name: Endereco da aplicacao
        run: |
          echo "Acesse: https://${STUDENT_NAMESPACE}.projetos.sapucaia.ifsul.edu.br"
